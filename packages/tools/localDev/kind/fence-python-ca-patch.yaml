spec:
  template:
    spec:
      volumes:
        - name: ca-certs
          secret:
            secretName: mkcert-ca
      containers:
        - name: fence
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/ssl/certs/mkcert-ca.crt
              subPath: ca.crt
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/mkcert-ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/mkcert-ca.crt
            - name: CURL_CA_BUNDLE
              value: /etc/ssl/certs/mkcert-ca.crt
